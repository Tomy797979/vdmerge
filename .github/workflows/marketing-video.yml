name: Marketing Video (edge-tts → Dropbox)

on:
  workflow_dispatch:
    inputs:
      media_urls:
        description: "Link ảnh/video, cách nhau bằng dấu phẩy hoặc xuống dòng (jpg/png/webp/mp4/mov...)"
        required: true
        type: string
      script_text:
        description: "Nội dung kịch bản (giọng đọc sẽ đọc chính xác đoạn này)"
        required: true
        type: string
      voice:
        description: "Giọng đọc Microsoft — mặc định Jenny (ấm, phù hợp nội dung cầu nguyện/POH)"
        required: true
        type: choice
        default: "en-US-JennyNeural"
        options:
          - en-US-JennyNeural
          - en-GB-SoniaNeural
          - en-US-AriaNeural
          - en-US-AnaNeural
          - en-US-GuyNeural
          - en-GB-RyanNeural
          - en-AU-NatashaNeural
          - vi-VN-HoaiMyNeural
          - vi-VN-NamMinhNeural
      rate:
        description: "Tốc độ đọc — mặc định -15% (chậm, tĩnh lặng, đúng nhịp cầu nguyện)"
        required: true
        type: choice
        default: "-15%"
        options:
          - "-25%"
          - "-20%"
          - "-15%"
          - "-12%"
          - "-8%"
          - "-4%"
          - "+0%"
          - "+8%"
      resolution:
        description: "Khung hình xuất"
        required: true
        type: choice
        default: "tiktok"
        options:
          - tiktok
          - youtube
          - original
      motion:
        description: "Chuyển động ảnh (chỉ áp dụng cho ảnh, video giữ nguyên)"
        required: true
        type: choice
        default: "kenburns"
        options:
          - kenburns
          - static
      caption_enable:
        description: "Tự động tạo caption (burn vào video)?"
        required: true
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      caption_style:
        description: "Style caption"
        required: true
        type: choice
        default: "poh_gold"
        options:
          - poh_gold
          - poh_box_plum
          - classic_white
      caption_position:
        description: "Vị trí caption"
        required: true
        type: choice
        default: "bottom"
        options:
          - bottom
          - center
          - top
      caption_words:
        description: "Số từ / 1 dòng caption"
        required: true
        type: choice
        default: "4"
        options:
          - "3"
          - "4"
          - "5"
          - "6"
      caption_font_size:
        description: "Cỡ chữ caption (px, theo PlayRes của video xuất ra)"
        required: true
        type: choice
        default: "40"
        options:
          - "28"
          - "34"
          - "40"
          - "48"
          - "56"
      output_name:
        description: "Tên file output"
        required: false
        type: string
        default: "marketing_video.mp4"
      dropbox_folder:
        description: "Thư mục Dropbox đích"
        required: false
        type: string
        default: "/Marketing"

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build video and upload to Dropbox
        env:
          MEDIA_URLS: ${{ inputs.media_urls }}
          SCRIPT_TEXT: ${{ inputs.script_text }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
          RESOLUTION: ${{ inputs.resolution }}
          MOTION: ${{ inputs.motion }}
          OUTPUT_NAME: ${{ inputs.output_name }}
          DROPBOX_FOLDER: ${{ inputs.dropbox_folder }}
          CAPTION_ENABLE: ${{ inputs.caption_enable }}
          CAPTION_STYLE: ${{ inputs.caption_style }}
          CAPTION_POSITION: ${{ inputs.caption_position }}
          CAPTION_WORDS: ${{ inputs.caption_words }}
          CAPTION_FONT_SIZE: ${{ inputs.caption_font_size }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python scripts/build_video.py
